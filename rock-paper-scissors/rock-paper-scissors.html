<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%233b82f6' d='M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z'/%3E%3C/svg%3E">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="rock-paper-scissors.css">
</head>
<body>
    <main class="game-container">
        <header class="game-header">
            <div class="header-nav">
                <a href="../index.html" class="home-btn">🏠 Home</a>
                <h1>Rock Paper Scissors</h1>
            </div>
            <p>Challenge the computer in this classic game!</p>
        </header>

        <section class="game-stats">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">🏆</div>
                    <div class="stat-info">
                        <span class="stat-label">Wins</span>
                        <span class="stat-value" id="wins">0</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🤝</div>
                    <div class="stat-info">
                        <span class="stat-label">Draws</span>
                        <span class="stat-value" id="draws">0</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">😔</div>
                    <div class="stat-info">
                        <span class="stat-label">Losses</span>
                        <span class="stat-value" id="losses">0</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🔥</div>
                    <div class="stat-info">
                        <span class="stat-label">Streak</span>
                        <span class="stat-value" id="streak">0</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📊</div>
                    <div class="stat-info">
                        <span class="stat-label">Win Rate</span>
                        <span class="stat-value" id="winRate">0%</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🎯</div>
                    <div class="stat-info">
                        <span class="stat-label">Total Games</span>
                        <span class="stat-value" id="totalGames">0</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="game-area">
            <div class="battle-arena">
                <div class="player-side">
                    <div class="player-label">You</div>
                    <div class="choice-display" id="playerChoice">
                        <div class="choice-placeholder">?</div>
                    </div>
                    <div class="choice-name" id="playerChoiceName">Make your choice</div>
                </div>
                
                <div class="vs-divider">
                    <div class="vs-text">VS</div>
                </div>
                
                <div class="computer-side">
                    <div class="player-label">Computer</div>
                    <div class="choice-display" id="computerChoice">
                        <div class="choice-placeholder">?</div>
                    </div>
                    <div class="choice-name" id="computerChoiceName">Waiting...</div>
                </div>
            </div>
        </section>

        <section class="choices-section">
            <h3>Choose Your Weapon:</h3>
            <div class="choices">
                <button class="choice-btn" data-choice="rock">
                    <div class="choice-icon">✊</div>
                    <div class="choice-label">Rock</div>
                </button>
                <button class="choice-btn" data-choice="paper">
                    <div class="choice-icon">✋</div>
                    <div class="choice-label">Paper</div>
                </button>
                <button class="choice-btn" data-choice="scissors">
                    <div class="choice-icon">✌️</div>
                    <div class="choice-label">Scissors</div>
                </button>
            </div>
        </section>

        <section class="result-section">
            <div class="result-message" id="resultMessage"></div>
            <div class="result-details" id="resultDetails"></div>
        </section>

        <section class="game-controls">
            <button class="btn btn-primary" id="resetStats">Reset Statistics</button>
            <button class="btn btn-secondary" id="showHistory">Game History</button>
        </section>

        <div class="history-modal" id="historyModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Game History</h3>
                    <button class="close-btn" id="closeHistory">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="history-list" id="historyList"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="rock-paper-scissors.js"></script>
</body>
</html>
