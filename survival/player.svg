<svg width="40" height="40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .body { fill: #4caf50; }
      .head { fill: #ffdbac; }
      .detail { fill: #000; }
    </style>
  </defs>
  <!-- Body -->
  <rect x="15" y="20" width="10" height="15" class="body"/>
  <!-- Head -->
  <circle cx="20" cy="12" r="8" class="head"/>
  <!-- Eyes -->
  <circle cx="17" cy="10" r="1" class="detail"/>
  <circle cx="23" cy="10" r="1" class="detail"/>
  <!-- Mouth -->
  <rect x="19" y="13" width="2" height="1" class="detail"/>
  <!-- Arms -->
  <rect x="10" y="22" width="5" height="2" class="body"/>
  <rect x="25" y="22" width="5" height="2" class="body"/>
  <!-- Legs -->
  <rect x="17" y="35" width="2" height="5" class="body"/>
  <rect x="21" y="35" width="2" height="5" class="body"/>
</svg>