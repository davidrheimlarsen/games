<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%233b82f6' d='M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z'/%3E%3C/svg%3E">
    <title>Clicker Game - Incremental Clicker</title>
    <link rel="stylesheet" href="clicker-game.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <div class="header-nav">
                <a href="../index.html" class="home-btn">🏠 Home</a>
                <h1>Clicker Game</h1>
            </div>
            <div class="game-info">
                <div class="currency-display">
                    <span class="currency-icon">💰</span>
                    <span class="currency-amount" id="currencyAmount">0</span>
                </div>
                <div class="stats-display">
                    <div class="stat-item">
                        <span class="stat-label">Per Click:</span>
                        <span class="stat-value" id="perClick">1</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Per Second:</span>
                        <span class="stat-value" id="perSecond">0</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="game-main">
            <div class="click-area">
                <button class="click-button" id="clickButton">
                    <span class="click-icon">👆</span>
                    <span class="click-text">CLICK ME!</span>
                </button>
                <div class="click-animation" id="clickAnimation"></div>
            </div>

            <aside class="upgrades-panel">
                <div class="upgrades-section">
                    <h2>Click Upgrades</h2>
                    <div class="upgrades-list" id="clickUpgrades">
                        <!-- Click upgrades will be generated by JavaScript -->
                    </div>
                </div>

                <div class="upgrades-section">
                    <h2>Auto Upgrades</h2>
                    <div class="upgrades-list" id="autoUpgrades">
                        <!-- Auto upgrades will be generated by JavaScript -->
                    </div>
                </div>

                <div class="upgrades-section">
                    <h2>Cosmetic Upgrades</h2>
                    <div class="upgrades-list" id="cosmeticUpgrades">
                        <!-- Cosmetic upgrades will be generated by JavaScript -->
                    </div>
                </div>

                <div class="game-controls">
                    <button class="btn btn-primary" id="saveBtn">Save Game</button>
                    <button class="btn btn-secondary" id="resetBtn">Reset Game</button>
                </div>
            </aside>
        </main>
    </div>

    <script src="clicker-game.js"></script>
</body>
</html>
