<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess - Strategic Board Game</title>
    <link rel="stylesheet" href="chess.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <div class="header-nav">
                <a href="../index.html" class="home-btn">🏠 Home</a>
                <h1>Chess</h1>
            </div>
            <div class="game-info">
                <div class="current-turn">
                    <span class="turn-label">Current Turn:</span>
                    <div class="turn-indicator">
                        <div class="turn-piece" id="turnPiece">♔</div>
                        <span id="turnText">White</span>
                    </div>
                </div>
                <div class="game-status" id="gameStatus">Game in Progress</div>
                <div class="game-mode">
                    <span class="mode-label">Game Mode:</span>
                    <select id="gameMode" class="mode-select">
                        <option value="pvp">Player vs Player</option>
                        <option value="ai">Player vs AI</option>
                    </select>
                </div>
                <div class="ai-difficulty" id="aiDifficultyContainer" style="display: none;">
                    <span class="difficulty-label">AI Difficulty:</span>
                    <select id="aiDifficulty" class="difficulty-select">
                        <option value="1">Easy</option>
                        <option value="2">Medium</option>
                        <option value="3" selected>Hard</option>
                        <option value="4">Expert</option>
                    </select>
                </div>
            </div>
        </header>

        <main class="game-main">
            <aside class="sidebar">
                <div class="captured-pieces">
                    <div class="captured-section">
                        <h3>White Captured</h3>
                        <div class="captured-list" id="whiteCaptured"></div>
                    </div>
                    <div class="captured-section">
                        <h3>Black Captured</h3>
                        <div class="captured-list" id="blackCaptured"></div>
                    </div>
                </div>
                
                <div class="move-history">
                    <h3>Move History</h3>
                    <div class="move-list" id="moveList"></div>
                </div>
                
                <div class="game-controls">
                    <button class="btn btn-primary" id="newGameBtn">New Game</button>
                    <button class="btn btn-secondary" id="undoBtn">Undo Move</button>
                    <button class="btn btn-secondary" id="resignBtn">Resign</button>
                </div>
            </aside>

            <div class="board-container">
                <div class="coordinates">
                    <div class="rank-labels">
                        <span>8</span>
                        <span>7</span>
                        <span>6</span>
                        <span>5</span>
                        <span>4</span>
                        <span>3</span>
                        <span>2</span>
                        <span>1</span>
                    </div>
                    <div class="file-labels">
                        <span>a</span>
                        <span>b</span>
                        <span>c</span>
                        <span>d</span>
                        <span>e</span>
                        <span>f</span>
                        <span>g</span>
                        <span>h</span>
                    </div>
                </div>
                
                <div class="chess-board" id="chessBoard">
                    <!-- Chess board will be generated by JavaScript -->
                </div>
            </div>
        </main>

        <div class="promotion-modal" id="promotionModal">
            <div class="modal-content">
                <h3>Promote Pawn</h3>
                <div class="promotion-pieces">
                    <button class="promotion-piece" data-piece="queen">♕</button>
                    <button class="promotion-piece" data-piece="rook">♖</button>
                    <button class="promotion-piece" data-piece="bishop">♗</button>
                    <button class="promotion-piece" data-piece="knight">♘</button>
                </div>
            </div>
        </div>

        <div class="game-over-modal" id="gameOverModal">
            <div class="modal-content">
                <h2 id="gameOverTitle">Game Over</h2>
                <p id="gameOverMessage">The game has ended.</p>
                <div class="game-over-buttons">
                    <button class="btn btn-primary" id="playAgainBtn">Play Again</button>
                    <button class="btn btn-secondary" id="closeModalBtn">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="chess.js"></script>
</body>
</html>
