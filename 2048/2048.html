<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <link rel="stylesheet" href="2048.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>2048</h1>
            <div class="scores">
                <div class="score-box">
                    <div class="score-label">Score</div>
                    <div class="score-value" id="score">0</div>
                </div>
                <div class="score-box">
                    <div class="score-label">Best</div>
                    <div class="score-value" id="best">0</div>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <button class="new-game-btn" id="newGame">New Game</button>
        </div>
        
        <div class="game-container">
            <div class="grid-container" id="grid">
                <!-- Grid cells will be generated by JS -->
            </div>
            <div class="tile-container" id="tiles">
                <!-- Tiles will be generated by JS -->
            </div>
        </div>
        
        <div class="instructions">
            <p>Use arrow keys or swipe to move tiles. Merge same numbers to reach 2048!</p>
        </div>
        
        <div class="game-over" id="gameOver">
            <div class="game-over-content">
                <h2>Game Over!</h2>
                <p>Final Score: <span id="finalScore">0</span></p>
                <button class="new-game-btn" id="tryAgain">Try Again</button>
            </div>
        </div>
        
        <div class="game-won" id="gameWon">
            <div class="game-won-content">
                <h2>You Win!</h2>
                <p>You reached 2048!</p>
                <button class="new-game-btn" id="continueGame">Continue</button>
                <button class="new-game-btn" id="newGameWin">New Game</button>
            </div>
        </div>
    </div>
    
    <script src="2048.js"></script>
</body>
</html>
